<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de trabalho infantil</title>
    <link rel="stylesheet" href="./css/login.css"> <!--faz o link com o css 'href' é o caminho do arquivo referência-->
    <script src="js/login.js" defer></script><!-- faz o link com o javascript, o defer espera o html carregar para poder executar-->
</head>
<body>

<main>

<div class="login-container">
    <h1>Sistema Lúdico</h1>
    <p>Digite o seu nome para começar:</p>

    <form id="login-form"> <!--usado para formulário com a função submit (form)-->

    <label for="student-name"> <!--esse label "for" faz que ao clicar no nome do aluno ele leva o curso para ‘input’ "id" ambos chamados de "student-name" caso contrário não funcionaria-->
    Nome do aluno
    </label>

    <input
            type="text"
            id="student-name"
            name="studentName"
            placeholder="Digite seu nome"
    >

    <button id="login-button" type="submit"><!--submit envia formulário-->
        ENTRAR
    </button>

    <p id="login-message" aria-live="polite"></p>
    </form>
</div>
    </main>

</body>
</html>
