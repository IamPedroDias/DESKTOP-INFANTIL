<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editor de Texto</title>

    <link rel="stylesheet" href="blocodenotas.css">
    <script src="blocodenotas.js" defer></script>
</head>
<body>

<main class="notepad">

    <section class="editor">

        <div class="toolbar">
            <select id="font-family" aria-label="Família da fonte">
                <option value="Arial">Arial</option>
                <option value="Comic Sans MS">Comic Sans MS</option>
                <option value="Courier New">Courier New</option>
                <option value="Georgia">Georgia</option>
                <option value="Verdana">Verdana</option>
                <option value="Times New Roman">Times New Roman</option>
            </select>

            <select id="font-size" aria-label="Tamanho da fonte">
                <option value="8">8</option>
                <option value="10">10</option>
                <option value="12" selected>12</option>
                <option value="14">14</option>
                <option value="16">16</option>
                <option value="18">18</option>
                <option value="20">20</option>
                <option value="24">24</option>
                <option value="28">28</option>
                <option value="32">32</option>
            </select>

            <button type="button" data-command="bold" aria-label="Negrito"><strong>B</strong></button>

            <button type="button" data-command="italic" aria-label="Itálico"><em>I</em></button>

            <button type="button" data-command="underline" aria-label="Sublinhado"><u>U</u></button>

            <button type="button" data-command="strikeThrough" aria-label="Tachado"><s>S</s></button>

            <div class="toolbar-group" role="group" aria-label="Alinhamento do texto">

                <button type="button" data-command="justifyLeft" aria-label="Alinha à esquerda" title="Alinhar à esquerda">≡ </button>

                <button type="button" data-command="justifyCenter" aria-label="centralizar" title="Centralizar">☰</button>

                <button type="button" data-command="justifyRight" aria-label="Alinhar à direita" title="Alinha à direita"> ≡</button>

                <button type="button" data-command="justifyFull" aria-label="Justificar" title="Justificar">☷</button>

            </div>

            <select id="paragraph-style" aria-label="Estilo de texto">
                <option value="p">Parágrafo</option>
                <option value="h1">Título</option>
                <option value="h2">Subtítulo</option>
                <option value="figure-title">Título de imagem</option>
                <option value="figure-caption">Legenda de imagem</option>
            </select>

            <div class="color-palette">
                <span>Cor:</span>

                <button type="button" data-color="#222222"
                        aria-label="Preto" title="Preto"
                        style="--swatch-color: #222222"></button>

                <button type="button" data-color="#E53935"
                        aria-label="Vermelho" title="Vermelho"
                        style="--swatch-color: #E53935"></button>

                <button type="button" data-color="#FB8C00"
                        aria-label="Laranja" title="Laranja"
                        style="--swatch-color: #FB8C00"></button>

                <button type="button" data-color="#FDD835"
                        aria-label="Amarelo" title="Amarelo"
                        style="--swatch-color: #FDD835"></button>

                <button type="button" data-color="#43A047"
                        aria-label="Verde" title="Verde"
                        style="--swatch-color: #43A047"></button>

                <button type="button" data-color="#1E88E5"
                        aria-label="Azul" title="Azul"
                        style="--swatch-color: #1E88E5"></button>

                <button type="button" data-color="#8E44AD"
                        aria-label="Roxo" title="Roxo"
                        style="--swatch-color: #8E44AD"></button>

                <button type="button" data-color="#EC407A"
                        aria-label="Rosa" title="Rosa"
                        style="--swatch-color: #EC407A"></button>

                <button type="button" data-color="#795548"
                        aria-label="Marrom" title="Marrom"
                        style="--swatch-color: #795548"></button>

                <button type="button" data-color="#FFFFFF"
                        aria-label="Branco" title="Branco"
                        style="--swatch-color: #FFFFFF"></button>

                <label for="font-color">Mais cores</label>
                <input type="color" id="font-color" value="#222222">
            </div>

        </div>

        <div class="text-editor" id="text-editor" contenteditable="true" role="textbox" aria-label="Área de edição de texto" aria-multiline="true"></div>

    </section>

</main>

</body>
</html>
